; OPcache for production, following the PHP manual's recommended settings
; (https://www.php.net/manual/en/opcache.installation.php) with two changes:
; - max_accelerated_files above the number of PHP files of a Laravel
;   application with its vendor directory (the manual's 4000 is too low);
; - validate_timestamps off, because the code in the image never changes
;   (the manual's note on validate_timestamps for production).
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
