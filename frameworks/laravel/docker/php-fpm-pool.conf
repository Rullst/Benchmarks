; Loaded after the image's www.conf, docker.conf and zz-docker.conf.
;
; Benchmark: listen on the Unix socket that the Nginx server block from
; Laravel's deployment documentation uses (the image's zz-docker.conf listens
; on TCP port 9000). Process management keeps the defaults of www.conf:
; pm = dynamic, pm.max_children = 5, pm.start_servers = 2,
; pm.min_spare_servers = 1, pm.max_spare_servers = 3.
[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
