; Loaded after the image's www.conf, docker.conf and zz-docker.conf.
;
; Listen on the Unix socket that the Nginx server block from Laravel's
; deployment documentation uses (the image's zz-docker.conf listens on TCP
; port 9000).
[www]
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Production sizing instead of www.conf's example values (dynamic, at most 5
; children). The PHP-FPM manual sizes pm.max_children by the memory available
; to the pool; a Laravel worker uses about 30-50 MiB next to the shared
; OPcache, so the 2 GiB container could hold 30 or more. The pool is capped
; at DB_POOL_SIZE (16, set by start.sh) because each child opens its own
; database connection: at most 16 connections, like every implementation.
; `static` keeps every child running, the mode the manual describes for a
; dedicated server with known memory.
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
