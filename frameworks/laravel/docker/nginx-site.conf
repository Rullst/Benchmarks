# The Nginx server block from Laravel's deployment documentation
# (https://laravel.com/docs/13.x/deployment#nginx), with the changes marked
# "Benchmark:". docker/start.sh replaces @PORT@ with $PORT.
server {
    # Benchmark: $PORT on IPv4 (documented: listen 80 and [::]:80).
    listen @PORT@;
    # Benchmark: the harness's host (documented: example.com). This is the
    # only server block, so it answers every request on the port anyway.
    server_name 127.0.0.1 localhost;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Benchmark: no access log (logging is off in this suite).
    access_log off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
