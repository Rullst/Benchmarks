# Dependencies as `loco new` generates them for a PostgreSQL app with
# server-side views (loco-rs features: the defaults without db-sqlite), minus
# the crates this app does not use (auth/mail models, validator, uuid, ts-rs,
# i18n). The empty migrator lives in src/migrator.rs instead of a separate
# `migration` crate: the `world` table is created by the harness.
[workspace]

[package]
name = "loco-bench"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "loco_bench-cli"

[dependencies]
loco-rs = { version = "=1.3.1", default-features = false, features = ["auth", "cli", "with-db", "cache_inmem", "worker", "db-postgres", "compression", "generators", "mailer"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread"] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
rand = "0.10"
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"] }

[[bin]]
name = "loco_bench-cli"
path = "src/bin/main.rs"
required-features = []

# The same release profile for every Rust implementation (the one
# `cargo rullst new` generates), so compiler settings are not a variable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
