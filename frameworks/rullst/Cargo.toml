# Dependencies and release profile as `cargo rullst new` generates them for a
# PostgreSQL project (validator and tracing left out: this app does not use
# them). The Rullst version is pinned exactly; the Dockerfile can override it
# with the RULLST_VERSION build argument.
[package]
name = "rullst-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[dependencies]
rullst = { version = "=13.0.0-alpha.5", default-features = false, features = ["orm", "strict-postgres", "studio"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
rullst-orm = { version = "=13.0.0-alpha.5", default-features = false, features = ["strict-postgres"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
