# Dependencies and release profile as `cargo rullst new` generates them for a
# PostgreSQL project (tracing left out: this app does not use it), with the
# session registry feature `cargo rullst auth` enables
# (`auth-session-registry-postgres`). The Rullst version is pinned exactly;
# the Dockerfile can override it with the RULLST_VERSION build argument.
[package]
name = "rullst-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[dependencies]
rullst = { version = "=13.0.0-alpha.6", default-features = false, features = ["orm", "strict-postgres", "studio", "auth-session-registry-postgres"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
# Used by #[derive(rullst::Validate)] DTOs (the derive expands to ::validator paths).
validator = { version = "0.21", features = ["derive"] }
rullst-orm = { version = "=13.0.0-alpha.6", default-features = false, features = ["strict-postgres"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
