[package]
name = "actix-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
actix-web = "4.19"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
askama = "0.16"
rand = "0.10"
# Phase 2 (docs/v3-spec.md): CSRF for the browser forms (actix-csrf,
# double-submit cookie), the signed-in session in actix-session's cookie
# store, Argon2id password verification for the login.
actix-csrf = "0.8"
# actix-csrf 0.8 generates its tokens with a rand 0.8 RNG (`StdRng`, as in its
# documentation).
rand_08 = { package = "rand", version = "0.8" }
actix-session = { version = "0.11", features = ["cookie-session"] }
argon2 = "0.6"

# The same release profile for every Rust implementation (the one
# `cargo rullst new` generates), so compiler settings are not a variable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
