# The harness sets PORT and DB_POOL_SIZE; Application.main translates
# DATABASE_URL into spring.datasource.url, username and password.
server.port=${PORT:8080}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:16}

# The world table already exists: Hibernate must not create, update or
# validate the schema (this is also Spring Boot's default for PostgreSQL).
spring.jpa.hibernate.ddl-auto=none

# Open EntityManager in View exists "to allow for lazy loading in web views";
# the reference says "If you do not want this behavior, you should set
# spring.jpa.open-in-view to false". No entity here has a lazy association, so
# it is off: no EntityManager is opened for every request and a pooled
# connection is not held while the view renders. See README.md.
spring.jpa.open-in-view=false

# JSON request bodies: Jackson converts a JSON string to a number by default
# ({"randomNumber": "5"} would bind as 5); PUT /world/{id} takes an integer.
spring.jackson.mapper.allow-coercion-of-scalars=false
