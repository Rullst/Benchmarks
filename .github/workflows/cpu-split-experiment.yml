name: CPU split experiment

# Temporary: measures Axum on one runner with PostgreSQL sharing the load
# generator's 2 vCPUs (the current split) and with a vCPU of its own (server 2,
# load generator 1, PostgreSQL 1), alternating, to decide the CPU split. The
# decision and the numbers are in the README ("CPU split"). Runs once when this
# file is pushed; removed after the decision.

on:
  workflow_dispatch:
  push:
    branches: ["feat/v2-phase1"]
    paths: [".github/workflows/cpu-split-experiment.yml"]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the load generator
        run: echo "BOMBARDIER=$(bench/install-bombardier.sh "$RUNNER_TEMP/bin")" >> "$GITHUB_ENV"
      - name: Measure Axum, alternating the two splits
        run: |
          set -euo pipefail
          for round in 1 2; do
            BENCH_DATABASE_CPUS=0 python3 bench/harness.py run --framework axum --rounds 1 --out "out/shared-$round.json"
            BENCH_DATABASE_CPUS=1 python3 bench/harness.py run --framework axum --rounds 1 --out "out/dedicated-$round.json"
          done
      - name: Compare
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, statistics
          from pathlib import Path
          runs = ["tier1.text", "tier1.json", "tier1.db-single", "tier1.html", "tier1.queries", "tier1.updates",
                  "tier1.fortunes", "tier2", "tier4"]
          fields = ["rps", "server_cpu_cores", "rps_per_cpu", "loadgen_cpu_busy", "db_cpu_busy", "db_cpu_cores",
                    "loadgen_cpu_cores", "latency_ms.p99", "client_bound"]
          def get(d, path):
              for p in path.split("."):
                  d = d.get(p) if isinstance(d, dict) else None
              return d
          print("| Run | Split | " + " | ".join(fields) + " |")
          print("| --- | --- |" + " ---: |" * len(fields))
          for run in runs:
              for split in ("shared", "dedicated"):
                  rounds = [r for f in sorted(Path("out").glob(f"{split}-*.json"))
                            for r in json.loads(f.read_text())["implementations"]["axum"].get("rounds", [])]
                  cells = []
                  for field in fields:
                      values = [get(get(r, run) or {}, field) for r in rounds]
                      values = [v for v in values if v is not None]
                      if field == "client_bound":
                          cells.append(f"{sum(1 for v in values if v)}/{len(values)}")
                      else:
                          cells.append(f"{statistics.median(values):,.3f}" if values else "–")
                  print(f"| {run} | {split} | " + " | ".join(cells) + " |")
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cpu-split
          path: out/
          retention-days: 30
