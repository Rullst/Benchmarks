name: Load generator experiment

# Temporary (phase 2 design, docs/v2-phase2-spec.md): measures Axum's /json on
# one runner with bombardier, wrk (static and per-request URLs), oha (static and
# per-request URLs) and wrk2, on 2 and on 1 client vCPUs, alternating, to choose
# the phase-2 load generator. Runs when this file or the experiment script is
# pushed to the design branch (workflow_dispatch works only once a workflow
# file exists on the default branch); removed after the decision.

on:
  push:
    branches: ["feat/v2-phase2-design"]
    paths:
      - ".github/workflows/loadgen-experiment.yml"
      - "bench/loadgen_experiment.py"

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the load generators
        run: |
          set -euo pipefail
          echo "BOMBARDIER=$(bench/install-bombardier.sh "$RUNNER_TEMP/bin")" >> "$GITHUB_ENV"
          echo "OHA=$(bench/install-loadgen.sh oha "$RUNNER_TEMP/bin")" >> "$GITHUB_ENV"
          echo "WRK=$(bench/install-loadgen.sh wrk "$RUNNER_TEMP/bin")" >> "$GITHUB_ENV"
          if wrk2="$(bench/install-loadgen.sh wrk2 "$RUNNER_TEMP/bin")"; then
            echo "WRK2=$wrk2" >> "$GITHUB_ENV"
          else
            echo "::warning::wrk2 did not build; the experiment runs without it"
          fi
          "$RUNNER_TEMP/bin/oha" --version
          "$RUNNER_TEMP/bin/wrk" --version || true
      - name: Measure
        run: python3 bench/loadgen_experiment.py --out out --rounds 3
      - name: Summary
        if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: loadgen-experiment
          path: |
            out/runs.json
            out/summary.md
          retention-days: 30
