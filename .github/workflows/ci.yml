name: CI

# Fast checks for every pull request, plus a conformance check (build the
# image, start PostgreSQL, check the endpoints it declares, sequentially and
# then under a short concurrent load) of each framework folder the pull
# request changes. A manual run checks the folders it names, or all of them
# (after a harness change that affects every folder).

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      frameworks:
        description: Comma-separated framework folders to check, or "all"
        default: all
      max_parallel:
        description: Conformance jobs at once (1-8)
        default: "4"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.changed.outputs.frameworks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s bench/tests -v
      - name: Validate framework folders
        run: python3 bench/harness.py validate
      - name: Check the database setup
        # Loads bench/db (init.sql, phase2.sql) into the pinned PostgreSQL,
        # checks the phase-2 accounts and their password hashes, and applies
        # every folder's db_setup file in a rolled-back transaction.
        run: python3 bench/harness.py db-check
      - name: Changed framework folders
        id: changed
        env:
          # A new push to a pull request checks only the folders that push
          # changed; opening it checks every folder it changes.
          BASE_SHA: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          IN_FRAMEWORKS: ${{ inputs.frameworks }}
        run: |
          set -euo pipefail
          changed='[]'
          if [ "$EVENT" = workflow_dispatch ]; then
            changed="$(python3 -c 'import json,sys; sys.path.insert(0, "bench"); from harness import resolve_frameworks
          from common import load_config
          spec = sys.argv[1]
          slugs = resolve_frameworks(spec)
          base = load_config()["baseline"]
          print(json.dumps(sorted(set(slugs) | ({base} if spec.strip().lower() in ("", "all") else set()))))' "${IN_FRAMEWORKS:-all}")"
          elif [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA" 2>/dev/null \
              && git diff --name-only "$BASE_SHA"...HEAD -- bench | grep -E \
                '^bench/(harness|conformance|conformance_phase2|load_check|measure|containers|loadgen|loadgen_wrk|loadgen_process|sessions|workload|common|config)\.(py|json)$|^bench/db/' \
                > /dev/null; then
            # A change to the conformance checks or what they run checks every folder.
            changed="$(python3 -c 'import json,sys; sys.path.insert(0, "bench"); from common import framework_slugs
          print(json.dumps(framework_slugs()))')"
          elif [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA"...HEAD -- frameworks | cut -d/ -f2 | sort -u \
              | while read -r slug; do [ -f "frameworks/$slug/bench.json" ] && echo "$slug"; done \
              | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          fi
          echo "frameworks=$changed" >> "$GITHUB_OUTPUT"
          echo "changed: $changed"

  conformance:
    needs: harness
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.harness.outputs.changed != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.max_parallel) || 4 }}
      matrix:
        framework: ${{ fromJson(needs.harness.outputs.changed) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Export a regenerated lockfile
        # A Dockerfile may have a `lockfile` stage that resolves the
        # dependencies and writes the lockfile to /; its output is uploaded
        # so ecosystems without a local toolchain can update their lockfile.
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          if grep -qiE '^FROM .* AS lockfile$' "frameworks/$FRAMEWORK/Dockerfile"; then
            docker build --target lockfile --output "type=local,dest=lockfiles/$FRAMEWORK" "frameworks/$FRAMEWORK"
            ls -la "lockfiles/$FRAMEWORK"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfile-${{ matrix.framework }}
          path: lockfiles/
          if-no-files-found: ignore
      - name: Build the load generator
        # The concurrent conformance step runs wrk (bench/load_check.py).
        run: echo "WRK=$(bench/install-loadgen.sh "$RUNNER_TEMP/bin")" >> "$GITHUB_ENV"
      - name: Build and check ${{ matrix.framework }}
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: python3 bench/harness.py conformance --framework "$FRAMEWORK" --out "conformance-$FRAMEWORK.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-${{ matrix.framework }}
          path: conformance-*.json
          if-no-files-found: ignore
